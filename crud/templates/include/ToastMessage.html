{% if messages %}
  {% for message in messages %}

    <div id="toast-success"
         class="fixed top-20 right-5 z-99999 flex items-center w-full max-w-xs p-4 mb-4 text-gray-500 bg-white rounded-lg shadow-lg"
         role="alert">
      <div class="inline-flex items-center justify-center shrink-0 w-8 h-8 rounded-lg
        {% if message.tags == 'success' %}
          text-green-500 bg-green-100
        {% elif message.tags == 'error' %}
          text-red-500 bg-red-100
        {% endif %}
      ">

        {% if message.tags == 'success' %}
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.7 8.2-4 4a1 1 0 0 1-1.4 0l-2-2a1 1 0 1 1 1.4-1.4L9 10.6l3.3-3.3a1 1 0 0 1 1.4 1.4Z"/>
          </svg>
        {% elif message.tags == 'error' %}
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 0a10 10 0 1 0 10 10A10 10 0 0 0 10 0Zm3 13a1 1 0 0 1-1.4 1.4L10 11.4l-1.6 1.6A1 1 0 1 1 7 11.6L8.6 10 7 8.4A1 1 0 1 1 8.4 7L10 8.6 11.6 7A1 1 0 1 1 13 8.4L11.4 10l1.6 1.6Z"/>
          </svg>
        {% endif %}
      </div>

      <div class="ms-3 text-sm font-normal">
        {{ message }}
      </div>

      <button type="button" onclick="this.parentElement.remove()" class="ms-auto text-gray-400 hover:text-gray-900">
        X
      </button>
    </div>

  {% endfor %}
{% endif %}
