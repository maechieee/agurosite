{% extends "layout/base.html" %}

{% block 'title' %} Add Gender {% endblock 'title' %}

{% block 'content' %}
{% include "include/Sidebar.html" %}
{% include "include/ToastMessage.html" %}

<div class="sm:ml-64 p-4 bg-gray-50">
  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 mb-5">
    <h1 class="text-2xl font-bold text-gray-800">Add Gender</h1>
    <p class="text-sm text-gray-500 mt-1">Create a new gender category.</p>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 max-w-md mx-auto">
    <form action="/gender/add/" method="post">
      {% csrf_token %}

      <div class="mb-4">
        <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">
          Gender
        </label>
        <input type="text" name="gender" id="gender" required placeholder="Enter gender (e.g. Male, Female)" 
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
      </div>

      <div class="flex justify-end gap-2">
        <a href="/gender/list/"
           class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm font-medium transition">
          Cancel
        </a>
        <button 
          type="submit"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium shadow-sm transition">
          Save Gender
        </button>
      </div>

    </form>
  </div>
</div>

{% endblock 'content' %}
